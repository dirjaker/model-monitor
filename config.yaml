mode: proxy
proxy:
  host: 127.0.0.1
  port: 12345
  timeout: 120
  target: https://api.deepseek.com
sniffer:
  port: 8080
  targets:
  - api.deepseek.com
web:
  host: 0.0.0.0
  port: '10004'
database:
  path: data/usage.db
providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key: 'REDACTED_DEEPSEEK_KEY'
    pricing:
      deepseek-chat:
        input: 1.0
        output: 2.0
      deepseek-reasoner:
        input: 4.0
        output: 16.0
      deepseek-v4-flash:
        input: 1.0
        output: 2.0
      deepseek-v4-pro:
        input: 2.0
        output: 8.0
alerts:
  enabled: false
  daily_threshold: 10.0
  monthly_threshold: 100.0
  webhook_url: ''
  webhook_headers: {}
