mode: proxy
proxy:
  host: 127.0.0.1
  port: 12345
  timeout: 120
  target: https://api.deepseek.com
sniffer:
  port: 8080
  targets:
  - api.deepseek.com
web:
  host: 0.0.0.0
  port: '10004'
database:
  path: data/usage.db
alerts:
  enabled: false
  daily_threshold: 10.0
  monthly_threshold: 100.0
  webhook_url: ''
  webhook_headers: {}
